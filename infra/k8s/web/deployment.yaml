apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: distroai
  labels:
    app: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: web
          image: ${ECR_REGISTRY}/distroai-web:${IMAGE_TAG}
          ports:
            - containerPort: 3001
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.distroai.in"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
      terminationGracePeriodSeconds: 15
