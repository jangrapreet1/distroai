apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: distroai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: distroai/prod
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: distroai/prod
        property: REDIS_URL
    - secretKey: JWT_ACCESS_SECRET
      remoteRef:
        key: distroai/prod
        property: JWT_ACCESS_SECRET
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: distroai/prod
        property: JWT_REFRESH_SECRET
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: distroai/prod
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: distroai/prod
        property: AWS_SECRET_ACCESS_KEY
    - secretKey: AWS_S3_BUCKET
      remoteRef:
        key: distroai/prod
        property: AWS_S3_BUCKET
    - secretKey: AWS_REGION
      remoteRef:
        key: distroai/prod
        property: AWS_REGION
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: distroai/prod
        property: OPENAI_API_KEY
    - secretKey: META_WHATSAPP_TOKEN
      remoteRef:
        key: distroai/prod
        property: META_WHATSAPP_TOKEN
    - secretKey: META_VERIFY_TOKEN
      remoteRef:
        key: distroai/prod
        property: META_VERIFY_TOKEN
    - secretKey: META_PHONE_NUMBER_ID
      remoteRef:
        key: distroai/prod
        property: META_PHONE_NUMBER_ID
    - secretKey: RAZORPAY_KEY_ID
      remoteRef:
        key: distroai/prod
        property: RAZORPAY_KEY_ID
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: distroai/prod
        property: RAZORPAY_KEY_SECRET
    - secretKey: SENTRY_DSN
      remoteRef:
        key: distroai/prod
        property: SENTRY_DSN
    - secretKey: CORS_ORIGINS
      remoteRef:
        key: distroai/prod
        property: CORS_ORIGINS
