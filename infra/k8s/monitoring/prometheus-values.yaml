# Prometheus + Grafana Helm values for kube-prometheus-stack
# Install: helm install kube-prometheus-stack prometheus-community/kube-prometheus-stack -n monitoring --create-namespace -f prometheus-values.yaml

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi

    # Scrape DistroAI services
    additionalScrapeConfigs:
      - job_name: distroai-api
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [distroai]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: api
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:3000
        metrics_path: /metrics
        scrape_interval: 15s

      - job_name: distroai-ai-service
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [distroai]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ai-service
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:8000
        metrics_path: /metrics
        scrape_interval: 30s

grafana:
  enabled: true
  adminPassword: changeme-in-production
  persistence:
    enabled: true
    size: 10Gi

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: distroai
          folder: DistroAI
          type: file
          options:
            path: /var/lib/grafana/dashboards/distroai

  dashboardsConfigMaps:
    distroai: distroai-grafana-dashboards

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://kube-prometheus-stack-prometheus:9090
          isDefault: true
        - name: Loki
          type: loki
          url: http://loki:3100

alertmanager:
  config:
    route:
      receiver: slack-warning
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - match:
            severity: critical
          receiver: pagerduty-critical
        - match:
            severity: warning
          receiver: slack-warning

    receivers:
      - name: pagerduty-critical
        pagerduty_configs:
          - service_key_file: /etc/alertmanager/secrets/pagerduty-key
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook
            channel: "#alerts-critical"
            title: "🚨 {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"

      - name: slack-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/slack-webhook
            channel: "#alerts-warning"
            title: "⚠️ {{ .GroupLabels.alertname }}"
            text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
