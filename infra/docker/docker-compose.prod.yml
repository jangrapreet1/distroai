services:
  # ─── Database (PostgreSQL 15 + pgvector + WAL-G PITR) ───
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: distroai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-distroai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-distroai}
      WALG_S3_PREFIX: ${WALG_S3_PREFIX}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID_B2}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY_B2}
      AWS_ENDPOINT: ${AWS_ENDPOINT_B2}
      AWS_REGION: ${AWS_REGION_B2:-us-west-004}
      AWS_S3_FORCE_PATH_STYLE: "true"
      PGUSER: ${POSTGRES_USER:-distroai}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      postgres
      -c wal_level=logical
      -c archive_mode=on
      -c archive_command='wal-push-safe "%p"'
      -c archive_timeout=60
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - distroai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-distroai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (BullMQ Queues + Session Cache) ──────────────
  redis:
    image: redis:7-alpine
    container_name: distroai_redis
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    networks:
      - distroai
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── AI Python Microservice (FastAPI + Prophet) ─────────
  ai-service:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.ai-service
    container_name: distroai_ai
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-distroai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-distroai}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - distroai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── NestJS API Backend ─────────────────────────────────
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: distroai_api
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-distroai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-distroai}?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai-service:8000
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - distroai
    volumes:
      - uploads_data:/tmp/distroai-uploads
    restart: unless-stopped

  # ─── BullMQ Background Worker ───────────────────────────
  worker:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.worker
    container_name: distroai_worker
    env_file: .env.production
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-distroai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-distroai}?schema=public}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_SECRET}
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - distroai
    volumes:
      - uploads_data:/tmp/distroai-uploads
    restart: unless-stopped

  # ─── Next.js Standalone Frontend ────────────────────────
  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:3000
        NEXT_PUBLIC_META_APP_ID: ${META_APP_ID:-}
    container_name: distroai_web
    environment:
      API_INTERNAL_URL: http://api:3000
    depends_on:
      - api
    networks:
      - distroai
    restart: unless-stopped

  # ─── Caddy Reverse Proxy (Auto-SSL + Security Headers) ──
  caddy:
    image: caddy:2-alpine
    container_name: distroai_caddy
    env_file: .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks:
      - distroai
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  caddy_data:
  caddy_config:

networks:
  distroai:
    driver: bridge
