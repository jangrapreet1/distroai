# ─── Redis Persistent Configuration ───
# DistroAI Production setup

# ─── Persistence (AOF) ──────────────────
# BullMQ queues, webhook retries, and JWT session refresh tokens
# reside in Redis. We cannot afford to drop these upon container restart.
appendonly yes
appendfsync everysec

# ─── Volatile Memory Limits ─────────────
# We also use Redis for ephemeral analytics caching.
# Ensure that if the droplet memory gets tight, Redis safely evicts
# ONLY the keys that have a TTL (aka analytics cache / rate limiters).
maxmemory 512mb
maxmemory-policy volatile-lru

# ─── Logging ────────────────────────────
loglevel warning
