name: DistroAI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER: distroai-prod

jobs:
  # ─── CI: Lint + Typecheck + Test ───────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: distroai
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: distroai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9.1.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @distroai/db exec prisma generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit Tests
        run: pnpm run test
        env:
          DATABASE_URL: postgresql://distroai:devpassword@localhost:5432/distroai_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-ci
          JWT_REFRESH_SECRET: test-refresh-secret-ci

      - name: Integration Tests
        run: pnpm run test:integration
        env:
          DATABASE_URL: postgresql://distroai:devpassword@localhost:5432/distroai_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test-access-secret-ci
          JWT_REFRESH_SECRET: test-refresh-secret-ci

  # ─── Build Docker images + Push to ECR ─────────────────
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [api, web, ai-service, worker]
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push ${{ matrix.service }}
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f infra/docker/Dockerfile.${{ matrix.service }} \
            -t $ECR_REGISTRY/distroai-${{ matrix.service }}:$IMAGE_TAG \
            -t $ECR_REGISTRY/distroai-${{ matrix.service }}:latest \
            .
          docker push $ECR_REGISTRY/distroai-${{ matrix.service }}:$IMAGE_TAG
          docker push $ECR_REGISTRY/distroai-${{ matrix.service }}:latest

  # ─── Deploy to EKS ────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Run database migrations
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s|\${ECR_REGISTRY}|$ECR_REGISTRY|g; s|\${IMAGE_TAG}|$IMAGE_TAG|g" infra/k8s/jobs/db-migrate.yaml
          kubectl apply -f infra/k8s/jobs/db-migrate.yaml
          kubectl wait --for=condition=complete job/db-migrate-$IMAGE_TAG -n distroai --timeout=300s

      - name: Deploy manifests
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Replace image placeholders in all deployment manifests
          for f in infra/k8s/api/deployment.yaml infra/k8s/web/deployment.yaml \
                   infra/k8s/ai-service/deployment.yaml infra/k8s/worker/deployment.yaml; do
            sed -i "s|\${ECR_REGISTRY}|$ECR_REGISTRY|g; s|\${IMAGE_TAG}|$IMAGE_TAG|g" "$f"
          done

          # Apply all manifests
          kubectl apply -f infra/k8s/namespace.yaml
          kubectl apply -f infra/k8s/api/
          kubectl apply -f infra/k8s/web/
          kubectl apply -f infra/k8s/ai-service/
          kubectl apply -f infra/k8s/worker/
          kubectl apply -f infra/k8s/ingress/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api -n distroai --timeout=300s
          kubectl rollout status deployment/web -n distroai --timeout=300s
          kubectl rollout status deployment/worker -n distroai --timeout=300s

      - name: Smoke test
        run: |
          sleep 30
          curl -sf https://api.distroai.in/health || exit 1
          echo "✅ Smoke test passed"

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,message,commit,author,action,eventName,ref
          text: |
            Deploy ${{ job.status == 'success' && '✅' || '❌' }} — ${{ github.sha }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
